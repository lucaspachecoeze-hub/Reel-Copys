<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Copy Generator</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    background: #0f0f12;
    color: #f2f2f2;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #9a9aa2; margin-top: 0; margin-bottom: 24px; }
  label { display: block; font-size: 0.85rem; color: #c8c8cf; margin-bottom: 6px; margin-top: 16px; }
  input[type="text"], select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1a1a1f;
    color: #f2f2f2;
    font-size: 1rem;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #6c5ce7;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    margin-top: 28px;
    padding: 16px;
    border-radius: 10px;
    background: #1a1a1f;
    border: 1px solid #2a2a30;
    white-space: pre-wrap;
    font-size: 0.95rem;
    line-height: 1.5;
    display: none;
  }
  .result.visible { display: block; }
  .copy-btn {
    margin-top: 12px;
    width: auto;
    padding: 8px 14px;
    font-size: 0.85rem;
    background: #2a2a30;
  }
  .status { margin-top: 16px; font-size: 0.9rem; color: #9a9aa2; display: none; }
  .status.visible { display: block; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
  <h1>Reel Copy Generator</h1>
  <p class="sub">Pegá el link de un video (Drive, YouTube, o cualquier link directo) y generá el copy para Instagram.</p>

  <label for="url">Link del video</label>
  <input type="text" id="url" placeholder="https://drive.google.com/...">

  <label for="tone">Tono</label>
  <select id="tone">
    <option value="casual y directo">Casual y directo</option>
    <option value="motivacional">Motivacional</option>
    <option value="divertido y con humor">Divertido / con humor</option>
    <option value="profesional y educativo">Profesional / educativo</option>
    <option value="storytelling emocional">Storytelling emocional</option>
  </select>

  <button id="submit">Generar copy</button>

  <div class="status" id="status"></div>
  <div class="result" id="result"></div>
  <button class="copy-btn" id="copyBtn" style="display:none;">Copiar</button>

<script>
const submitBtn = document.getElementById('submit');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const copyBtn = document.getElementById('copyBtn');

submitBtn.addEventListener('click', async () => {
  const url = document.getElementById('url').value.trim();
  const tone = document.getElementById('tone').value;
  if (!url) {
    statusEl.textContent = 'Pegá un link primero.';
    statusEl.className = 'status visible error';
    return;
  }

  submitBtn.disabled = true;
  resultEl.className = 'result';
  copyBtn.style.display = 'none';
  statusEl.textContent = 'Descargando y transcribiendo el video... puede tardar un minuto.';
  statusEl.className = 'status visible';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, tone })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Error desconocido');

    resultEl.textContent = data.copy;
    resultEl.className = 'result visible';
    copyBtn.style.display = 'inline-block';
    statusEl.className = 'status';
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    statusEl.className = 'status visible error';
  } finally {
    submitBtn.disabled = false;
  }
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(resultEl.textContent);
  copyBtn.textContent = 'Copiado ✓';
  setTimeout(() => copyBtn.textContent = 'Copiar', 1500);
});
</script>
</body>
</html>
